<!doctype html>
<html><head><meta charset="UTF-8"><style>
body { margin:0; background:#0b0c0b; font-family:-apple-system,Arial,sans-serif; display:flex; }
.col { flex:1; padding:60px 40px; }
.swatch { width:100%; height:140px; border-radius:16px; margin-bottom:20px; }
h2 { color:#f5f0e8; font-size:22px; margin-bottom:6px; }
p { color:#b8b3a8; font-size:14px; margin-bottom:4px; }
.word { font-size:48px; font-weight:800; margin-top:24px; }
</style></head>
<body>
  <div class="col">
    <div class="swatch" style="background:#3a6b7d;"></div>
    <h2>Azul río profundo</h2>
    <p>Hex: #3A6B7D</p>
    <p>Frío, sereno, profundo — como agua en movimiento.</p>
    <div class="word" style="color:#3a6b7d;">despertando</div>
  </div>
  <div class="col">
    <div class="swatch" style="background:#9CAF88;"></div>
    <h2>Verde salvia</h2>
    <p>Hex: #9CAF88</p>
    <p>Cálido, terroso, orgánico — como una planta, no una pantalla.</p>
    <div class="word" style="color:#9CAF88;">despertando</div>
  </div>
</body></html>
